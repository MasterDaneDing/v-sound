<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The "V" Sound - Exact SRT Synced Animation</title>
  <style>
    :root {
      --bg-dark: #16192b;
      --panel-bg: #222742;
      --accent: #ffcc00;
      --text-light: #ffffff;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg-dark);
      color: var(--text-light);
      font-family: 'Segoe UI', 'Comic Sans MS', 'Chalkboard SE', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
      user-select: none;
    }
    .control-bar {
      width: 100%;
      max-width: 1080px;
      background: var(--panel-bg);
      padding: 12px 18px;
      border-radius: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      margin-bottom: 12px;
      border: 2px solid #363e66;
    }
    .control-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .file-btn {
      background: linear-gradient(135deg, #7b2cbf, #5a189a);
      color: #fff;
      padding: 9px 16px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      border: 2px solid #9d4edd;
      transition: transform 0.15s, background 0.2s;
      display: inline-block;
      font-size: 0.95rem;
    }
    .file-btn:hover {
      transform: translateY(-2px);
      background: linear-gradient(135deg, #9d4edd, #7b2cbf);
    }
    input[type="file"] {
      display: none;
    }
    button.btn {
      background: linear-gradient(135deg, #ff9e00, #ff6d00);
      color: #1a1a1a;
      border: 2px solid #ffd166;
      padding: 9px 18px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
      transition: transform 0.15s;
    }
    button.btn:hover {
      transform: translateY(-2px);
    }
    button.btn.secondary {
      background: #3a416f;
      color: #fff;
      border-color: #5c67a3;
    }
    .scrubber-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 220px;
    }
    input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .time-readout {
      font-family: monospace;
      font-size: 0.95rem;
      background: #131629;
      padding: 5px 10px;
      border-radius: 8px;
      border: 1px solid #363e66;
      min-width: 115px;
      text-align: center;
    }
    .offset-box {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      background: #171b30;
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid #363e66;
    }
    .offset-box input {
      width: 64px;
      background: #0d1021;
      color: var(--accent);
      border: 1px solid #4a548c;
      border-radius: 5px;
      padding: 3px 6px;
      font-weight: bold;
      text-align: center;
    }
    .stage-container {
      position: relative;
      width: 100%;
      max-width: 1080px;
      aspect-ratio: 16 / 9;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 14px 40px rgba(0,0,0,0.65);
      border: 4px solid #3c4470;
      background: #87ceeb;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .lyric-banner {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: 92%;
      background: rgba(18, 21, 41, 0.92);
      border: 3px solid #ffcc00;
      border-radius: 20px;
      padding: 14px 24px;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.65);
      pointer-events: none;
      transition: transform 0.15s ease;
    }
    .lyric-line {
      font-size: clamp(1.35rem, 3.2vw, 2.45rem);
      color: #ffffff;
      font-weight: 500;
      letter-spacing: 0.5px;
      line-height: 1.25;
      text-shadow: 0 3px 6px rgba(0,0,0,0.8);
    }
    /* Bold & highlight every V word! */
    .lyric-line b.v-word {
      font-weight: 900;
      color: #ffea00;
      text-shadow: 0 0 12px rgba(255, 234, 0, 0.7), 0 4px 0 #d84315, 0 6px 10px rgba(0,0,0,0.9);
      display: inline-block;
      transform: scale(1.08);
      margin: 0 3px;
      padding: 0 5px;
      background: rgba(255, 87, 34, 0.25);
      border-radius: 8px;
      border-bottom: 3px solid #ff9100;
    }
    .lyric-sub {
      font-size: clamp(0.85rem, 1.5vw, 1.1rem);
      color: #b8c1ec;
      margin-top: 4px;
      font-weight: 600;
    }
    .status-pill {
      font-size: 0.82rem;
      color: #ffd166;
    }
  </style>
</head>
<body>

  <div class="control-bar">
    <div class="control-group">
      <button class="btn" id="playBtn">▶ Play</button>
      <button class="btn secondary" id="restartBtn">⏮ Restart</button>
      <span class="status-pill" id="fileStatus">Loading audio…</span>
    </div>

    <div class="scrubber-wrap">
      <input type="range" id="scrubber" min="0" max="50" step="0.01" value="0" />
      <div class="time-readout" id="timeReadout">00.00s / 50.00s</div>
    </div>

    <div class="offset-box" title="Optional fine-tune nudge in seconds (0.00 = exact SRT timestamps)">
      <label for="syncNudge">Sync Nudge (s):</label>
      <input type="number" id="syncNudge" step="0.05" min="-5" max="5" value="0.00" />
    </div>
  </div>

  <div class="stage-container">
    <canvas id="stage" width="1280" height="720"></canvas>
    <div class="lyric-banner" id="lyricBanner">
      <div class="lyric-line" id="lyricText">🎵 Get Ready for the <b class="v-word">"V"</b> Sound! 🎵</div>
      <div class="lyric-sub" id="lyricSub">Instrumental Intro (0:00 - 0:09.42)</div>
    </div>
  </div>

  <audio id="audioPlayer" preload="auto" src="v-sound.mp3" playsinline></audio>

  <script>
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');

    const audioPlayer = document.getElementById('audioPlayer');
    const playBtn = document.getElementById('playBtn');
    const restartBtn = document.getElementById('restartBtn');
    const scrubber = document.getElementById('scrubber');
    const timeReadout = document.getElementById('timeReadout');
    const fileStatus = document.getElementById('fileStatus');
    const lyricText = document.getElementById('lyricText');
    const lyricSub = document.getElementById('lyricSub');
    const syncNudgeInput = document.getElementById('syncNudge');

    let hasAudio = true;
    let isPlaying = false;
    let simTime = 0;
    let totalDuration = 50.0;
    let lastFrameTime = performance.now();

    // Particles for Cobra Man's angry stomps & Violin musical notes
    const stompPuffs = [];
    const floatingNotes = [];
    let lastCobraStepSide = 0;

    // ============================================================================
    // EXACT SRT TIMECODES (FROM V_sound_lyrics.srt)
    // ============================================================================
    const SRT_TIMELINE = [
      // Intro before first SRT subtitle (00:00:00,000 --> 00:00:09,420)
      {
        start: 0.000, end: 9.420,
        html: '🎵 Get Ready for the <b class="v-word">"V"</b> Sound! 🎵',
        sub: 'Instrumental Intro • Phonics Man & The V Monster warming up!',
        scene: 'intro'
      },
      // 1: 00:00:09,420 --> 00:00:11,040 (bridged to 11.370)
      {
        start: 9.420, end: 11.370,
        html: '<b class="v-word">V, V, V!</b>',
        sub: 'Line 1 • Phonics Man & The V Monster!',
        scene: 'v_intro'
      },
      // 2: 00:00:11,370 --> 00:00:13,290 (bridged to 13.440)
      {
        start: 11.370, end: 13.440,
        html: 'It\'s in <b class="v-word">very</b> important words.',
        sub: 'Line 2 • Phonics Man & The V Monster',
        scene: 'v_intro'
      },
      // 3: 00:00:13,440 --> 00:00:15,570
      {
        start: 13.440, end: 15.570,
        html: 'It has the "<b class="v-word">V</b>" sound.',
        sub: 'Line 3 • Feel that "V" sound!',
        scene: 'v_intro'
      },
      // 4: 00:00:15,570 --> 00:00:17,700 (bridged to 17.850)
      {
        start: 15.570, end: 17.850,
        html: 'The sound you just heard!',
        sub: 'Line 4 • Phonics Man & The V Monster',
        scene: 'v_intro'
      },
      // 5: 00:00:17,850 --> 00:00:19,200
      {
        start: 17.850, end: 19.200,
        html: '<b class="v-word">V-v-violin!</b>',
        sub: 'Line 5 • Enter Violin Man!',
        scene: 'violin'
      },
      // 6: 00:00:19,200 --> 00:00:21,500 (bridged to 21.700)
      {
        start: 19.200, end: 21.700,
        html: 'We love the <b class="v-word">violin!</b>',
        sub: 'Line 6 • Violin Man plays a sweet melody!',
        scene: 'violin'
      },
      // 7: 00:00:21,700 --> 00:00:22,140
      {
        start: 21.700, end: 22.140,
        html: '<b class="v-word">V-v-Viking!</b>',
        sub: 'Line 7 • Enter the mighty Viking!',
        scene: 'viking'
      },
      // 8: 00:00:22,140 --> 00:00:25,900 (bridged to 26.340)
      {
        start: 22.140, end: 26.340,
        html: 'He\'s scary, don\'t look at him!',
        sub: 'Line 8 • Phonics Man & V Monster cover their eyes!',
        scene: 'viking_scary'
      },
      // 9: 00:00:26,340 --> 00:00:27,720
      {
        start: 26.340, end: 27.720,
        html: '<b class="v-word">V-V-Vegetable.</b>',
        sub: 'Line 9 • Super Choy-sum Man arrives!',
        scene: 'vegetable'
      },
      // 10: 00:00:27,720 --> 00:00:29,800
      {
        start: 27.720, end: 29.800,
        html: 'They\'re good for you!',
        sub: 'Line 10 • Choy-sum Man powers up!',
        scene: 'vegetable'
      },
      // 11: 00:00:29,800 --> 00:00:32,800
      {
        start: 29.800, end: 32.800,
        html: 'Now you know the "<b class="v-word">v</b>" sound!',
        sub: 'Line 11 • Everyone dances together!',
        scene: 'finale'
      },
      // 12: 00:00:32,800 --> 00:00:35,340
      {
        start: 32.800, end: 35.340,
        html: 'So don\'t feel blue!',
        sub: 'Line 12 • Big superhero finish!',
        scene: 'finale'
      },
      // Outro after 00:00:35,340 --> 00:00:50,000
      {
        start: 35.340, end: 60.000,
        html: '🎉 <b class="v-word">V-V-Violin</b> • <b class="v-word">V-V-Viking</b> • <b class="v-word">V-V-Vegetable!</b> 🎉',
        sub: 'Instrumental Outro (35.34s - 50.00s) • Great job!',
        scene: 'outro'
      }
    ];

    // Bundled audio + autoplay (browsers may block unmuted autoplay until a tap)
    function markAudioReady() {
      hasAudio = true;
      if (audioPlayer.duration && !isNaN(audioPlayer.duration)) {
        totalDuration = audioPlayer.duration;
        scrubber.max = totalDuration.toFixed(2);
      }
      fileStatus.textContent = 'V sound.mp3 ready (SRT Synced)';
    }

    function tryAutoplay() {
      const p = audioPlayer.play();
      if (p && typeof p.then === 'function') {
        p.then(() => {
          isPlaying = true;
          playBtn.textContent = '⏸ Pause';
          fileStatus.textContent = 'Playing…';
        }).catch(() => {
          isPlaying = false;
          playBtn.textContent = '▶ Play';
          fileStatus.textContent = 'Tap ▶ Play to start (browser blocked autoplay)';
        });
      }
    }

    audioPlayer.addEventListener('loadedmetadata', markAudioReady);
    if (audioPlayer.readyState >= 1) markAudioReady();
    audioPlayer.addEventListener('canplaythrough', () => tryAutoplay(), { once: true });
    // Also try once DOM is ready in case canplaythrough already fired
    setTimeout(tryAutoplay, 300);

    playBtn.addEventListener('click', () => {
      if (hasAudio) {
        if (audioPlayer.paused) {
          audioPlayer.play();
          isPlaying = true;
          playBtn.textContent = '⏸ Pause';
        } else {
          audioPlayer.pause();
          isPlaying = false;
          playBtn.textContent = '▶ Play';
        }
      } else {
        isPlaying = !isPlaying;
        playBtn.textContent = isPlaying ? '⏸ Pause' : '▶ Play';
      }
    });

    restartBtn.addEventListener('click', () => {
      if (hasAudio) {
        audioPlayer.currentTime = 0;
        audioPlayer.play();
        isPlaying = true;
        playBtn.textContent = '⏸ Pause';
      } else {
        simTime = 0;
        isPlaying = true;
        playBtn.textContent = '⏸ Pause';
      }
    });

    scrubber.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      if (hasAudio) {
        audioPlayer.currentTime = val;
      } else {
        simTime = val;
      }
    });

    audioPlayer.addEventListener('ended', () => {
      isPlaying = false;
      playBtn.textContent = '▶ Play';
    });

    function getCurrentStep(t) {
      const nudge = parseFloat(syncNudgeInput.value) || 0.0;
      const adjustedTime = Math.max(0, t - nudge);
      for (let i = 0; i < SRT_TIMELINE.length; i++) {
        const item = SRT_TIMELINE[i];
        if (adjustedTime >= item.start && adjustedTime < item.end) {
          return item;
        }
      }
      return SRT_TIMELINE[SRT_TIMELINE.length - 1];
    }

    // ============================================================================
    // CHARACTER DRAWING FUNCTIONS (MATCHING REFERENCE IMAGES)
    // ============================================================================

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, r);
      ctx.fill();
      ctx.stroke();
    }

    // 1. COBRA MAN (Villain in background: black faceted cobra hood, purple eyes, scar, dark armor, purple cape, angry stomp)
    function drawCobraMan(ctx, x, y, scale, t) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);

      const stompSpeed = 9.5;
      const stride = Math.sin(t * stompSpeed);
      const leftLegLift = Math.max(0, stride) * 22;
      const rightLegLift = Math.max(0, -stride) * 22;
      const bodyBob = Math.abs(Math.cos(t * stompSpeed)) * 8;
      const bodyTilt = stride * 0.08;

      if (stride > 0.92 && lastCobraStepSide !== 1) {
        lastCobraStepSide = 1;
        stompPuffs.push({ x: x + 28 * scale, y: y + 95 * scale, r: 6, alpha: 0.9, vx: 25, vy: -15 });
      } else if (stride < -0.92 && lastCobraStepSide !== -1) {
        lastCobraStepSide = -1;
        stompPuffs.push({ x: x - 28 * scale, y: y + 95 * scale, r: 6, alpha: 0.9, vx: -25, vy: -15 });
      }

      // Ground shadow
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.beginPath();
      ctx.ellipse(0, 98, 55, 14, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.translate(0, -bodyBob);
      ctx.rotate(bodyTilt);

      ctx.lineWidth = 4;
      ctx.strokeStyle = '#111';

      // Purple Cape with wavy serpent pattern
      ctx.fillStyle = '#4a156b';
      ctx.beginPath();
      ctx.moveTo(-38, -15);
      ctx.lineTo(-68 - Math.sin(t * 6) * 6, 85);
      ctx.quadraticCurveTo(0, 95, 68 + Math.cos(t * 6) * 6, 85);
      ctx.lineTo(38, -15);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Purple serpent motif on cape
      ctx.strokeStyle = '#8e2de2';
      ctx.lineWidth = 7;
      ctx.beginPath();
      ctx.moveTo(0, -5);
      ctx.bezierCurveTo(-30, 20, 30, 45, -10, 78);
      ctx.stroke();
      ctx.strokeStyle = '#111';
      ctx.lineWidth = 4;

      // Purple glowing staff strapped/held
      ctx.save();
      ctx.translate(42, 10 - rightLegLift * 0.4);
      ctx.rotate(0.45 + Math.sin(t * stompSpeed) * 0.25);
      ctx.fillStyle = '#2b2b36';
      roundRect(ctx, -6, -75, 12, 140, 4);
      ctx.fillStyle = '#a855f7';
      ctx.fillRect(-4, -55, 8, 22);
      ctx.fillRect(-4, 25, 8, 22);
      ctx.restore();

      // Left Leg
      ctx.save();
      ctx.translate(-22, 42 - leftLegLift);
      ctx.fillStyle = '#26262e';
      roundRect(ctx, -14, 0, 28, 42, 6);
      ctx.fillStyle = '#3f3f4e';
      roundRect(ctx, -12, 6, 24, 14, 4);
      ctx.fillStyle = '#1c1c24';
      roundRect(ctx, -18, 34, 34, 20, 8);
      ctx.restore();

      // Right Leg
      ctx.save();
      ctx.translate(22, 42 - rightLegLift);
      ctx.fillStyle = '#26262e';
      roundRect(ctx, -14, 0, 28, 42, 6);
      ctx.fillStyle = '#3f3f4e';
      roundRect(ctx, -12, 6, 24, 14, 4);
      ctx.fillStyle = '#1c1c24';
      roundRect(ctx, -16, 34, 34, 20, 8);
      ctx.restore();

      // Armored Torso
      ctx.fillStyle = '#22222b';
      roundRect(ctx, -34, -18, 68, 65, 12);
      ctx.fillStyle = '#3d3d4d';
      ctx.beginPath();
      ctx.moveTo(-26, -10);
      ctx.lineTo(0, -2);
      ctx.lineTo(26, -10);
      ctx.lineTo(20, 22);
      ctx.lineTo(0, 30);
      ctx.lineTo(-20, 22);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Utility Belt
      ctx.fillStyle = '#1a1a22';
      roundRect(ctx, -36, 32, 72, 14, 4);
      ctx.fillStyle = '#4e4e61';
      roundRect(ctx, -10, 30, 20, 18, 3);

      // Left Arm
      ctx.save();
      ctx.translate(-40, -6 + rightLegLift * 0.5);
      ctx.rotate(0.35 + stride * 0.35);
      ctx.fillStyle = '#2e2e3a';
      roundRect(ctx, -12, 0, 24, 44, 8);
      ctx.fillStyle = '#15151c';
      ctx.beginPath();
      ctx.arc(0, 46, 13, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.restore();

      // Right Arm
      ctx.save();
      ctx.translate(40, -6 + leftLegLift * 0.5);
      ctx.rotate(-0.35 - stride * 0.35);
      ctx.fillStyle = '#2e2e3a';
      roundRect(ctx, -12, 0, 24, 44, 8);
      ctx.fillStyle = '#15151c';
      ctx.beginPath();
      ctx.arc(0, 46, 13, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.restore();

      // Geometric Faceted Black Cobra Hood Helmet
      ctx.save();
      ctx.translate(0, -68);

      ctx.fillStyle = '#25252e';
      ctx.beginPath();
      ctx.moveTo(-45, 52);
      ctx.lineTo(-82, -8);
      ctx.lineTo(-55, -52);
      ctx.lineTo(0, -60);
      ctx.lineTo(55, -52);
      ctx.lineTo(82, -8);
      ctx.lineTo(45, 52);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#383846';
      ctx.beginPath();
      ctx.moveTo(-55, -52);
      ctx.lineTo(0, -60);
      ctx.lineTo(0, -18);
      ctx.lineTo(-42, -22);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#1d1d24';
      ctx.beginPath();
      ctx.moveTo(55, -52);
      ctx.lineTo(0, -60);
      ctx.lineTo(0, -18);
      ctx.lineTo(42, -22);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Glowing Purple Cobra Hood Eyes
      ctx.fillStyle = '#a855f7';
      ctx.shadowColor = '#d8b4fe';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.ellipse(-34, -30, 16, 9, 0.35, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.beginPath();
      ctx.ellipse(34, -30, 16, 9, -0.35, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.shadowBlur = 0;

      // Face Opening inside Cobra Hood
      ctx.fillStyle = '#f3b67f';
      ctx.beginPath();
      ctx.arc(0, 16, 36, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // Center V-brow helmet nose guard
      ctx.fillStyle = '#2f2f3b';
      ctx.beginPath();
      ctx.moveTo(-38, -12);
      ctx.lineTo(0, 12);
      ctx.lineTo(38, -12);
      ctx.lineTo(30, -24);
      ctx.lineTo(0, -8);
      ctx.lineTo(-30, -24);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Facial Scar
      ctx.strokeStyle = '#b5654d';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(-24, 2);
      ctx.lineTo(-16, 20);
      ctx.stroke();

      // Eyes & Angry Scowling Eyebrows
      ctx.fillStyle = '#111';
      ctx.beginPath();
      ctx.arc(-16, 16, 5.5, 0, Math.PI * 2);
      ctx.arc(16, 16, 5.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(-18, 14, 2, 0, Math.PI * 2);
      ctx.arc(14, 14, 2, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#111';
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-27, 6);
      ctx.lineTo(-8, 13);
      ctx.moveTo(27, 6);
      ctx.lineTo(8, 13);
      ctx.stroke();

      // Angry Gritted Mouth
      ctx.lineWidth = 3.5;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(0, 36, 11, Math.PI, 0, false);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.restore();
      ctx.restore();
    }

    // 2. PHONICS MAN (Bald head, purple glasses, purple cape, yellow shirt with red circle & 'P', blue track pants)
    function drawPhonicsMan(ctx, x, y, scale, t, mode = 'dance') {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);

      const beat = Math.sin(t * 9);
      const bounce = Math.abs(beat) * 14;
      const sway = Math.sin(t * 4.5) * 0.07;

      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.beginPath();
      ctx.ellipse(0, 115, 58, 14, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.translate(0, -bounce);

    // 3. THE V MONSTER (Fuzzy brown V-shaped monster, two big eyes at tips, maroon bow tie)
    function drawVMonster(ctx, x, y, scale, t, mode = 'dance') {
      ctx.save();

      const bounce = Math.abs(Math.sin(t * 9.5)) * 16;

      ctx.lineCap = 'round';

      const armWave = Math.sin(t * 10) * 0.35;

      ctx.save();

      ctx.beginPath();
      ctx.ellipse(-18, 0, 20, 13, -0.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.restore();

      // Right Arm
      ctx.save();
      ctx.translate(36, 18);
      ctx.rotate(mode === 'scared' ? 1.4 : -0.3 - armWave);
      ctx.beginPath();
      ctx.ellipse(18, 0, 20, 13, 0.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.restore();

      // Main V-Shaped Fuzzy Body & Legs
      ctx.beginPath();
      ctx.moveTo(0, 62);
      ctx.lineTo(-10, 95);
      ctx.quadraticCurveTo(-32, 102, -48, 92);
      ctx.quadraticCurveTo(-55, 75, -36, 65);
      ctx.lineTo(-34, 30);
      ctx.lineTo(-76 + earWiggle, -85);
      ctx.arc(-50 + earWiggle, -92, 28, Math.PI * 0.9, Math.PI * 1.95);
      ctx.lineTo(0, -2);
      ctx.lineTo(24 - earWiggle, -92);
      ctx.arc(50 - earWiggle, -92, 28, Math.PI * 1.05, Math.PI * 0.1);
      ctx.lineTo(34, 30);
      ctx.lineTo(36, 65);
      ctx.quadraticCurveTo(55, 75, 48, 92);
      ctx.quadraticCurveTo(32, 102, 10, 95);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Fur texture tufts
      ctx.strokeStyle = '#6e3f11';
      ctx.lineWidth = 3;
      const furSpots = [
        [-42, -35], [-28, -5], [-16, 20],
        [42, -35], [28, -5], [16, 20],
        [-22, 55], [22, 55]
      ];
      furSpots.forEach(([fx, fy]) => {
        ctx.beginPath();
        ctx.arc(fx, fy, 5, 0.2, Math.PI - 0.2);
        ctx.arc(fx + 8, fy, 5, 0.2, Math.PI - 0.2);
        ctx.stroke();

      // Giant Eyes inside the two top V stalks
      ctx.strokeStyle = '#1a1108';
      ctx.lineWidth = 4.5;

        ctx.fillStyle = '#fff9eb';
        ctx.beginPath();
        ctx.arc(ex, -84, 21, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        if (mode === 'scared') {
          ctx.fillStyle = '#1f140e';
          ctx.beginPath();
          ctx.arc(ex, -84, 6, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.fillStyle = '#1f140e';
          ctx.beginPath();
          ctx.arc(ex + 2, -84, 12, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#fff';
          ctx.beginPath();
          ctx.arc(ex + 5, -88, 4, 0, Math.PI * 2);
          ctx.fill();
        }
      });

      // Maroon Bow Tie
      ctx.fillStyle = '#6b1d20';
      ctx.beginPath();
      ctx.moveTo(0, 34);
      ctx.lineTo(-28, 20);
      ctx.lineTo(-28, 48);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(0, 34);
      ctx.lineTo(28, 20);
      ctx.lineTo(28, 48);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#521316';
      roundRect(ctx, -7, 25, 14, 18, 4);

      ctx.restore();
    }

      ctx.lineTo(-56, 86);
      ctx.lineTo(56, 86);
      ctx.lineTo(32, 6);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Legs & Boots
      ctx.fillStyle = '#4ea82f';
      roundRect(ctx, -28, 52, 24, 38, 6);
      roundRect(ctx, 4, 52, 24, 38, 6);
      ctx.fillStyle = '#76c84d';
      roundRect(ctx, -34, 82, 32, 22, 10);
      roundRect(ctx, 2, 82, 32, 22, 10);

      // Green Torso
      ctx.fillStyle = '#4ea82f';
      roundRect(ctx, -34, 6, 68, 52, 10);

      // White Belt
      ctx.fillStyle = '#ffffff';
      roundRect(ctx, -35, 42, 70, 12, 3);
      ctx.fillStyle = '#2d8a1e';
      ctx.beginPath();
      ctx.arc(0, 48, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // 'F' Emblem on Chest
      ctx.font = '900 28px "Segoe UI", Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineWidth = 7;
      ctx.strokeStyle = '#fff';
      ctx.strokeText('F', 0, 25);
      ctx.fillStyle = '#111';
      ctx.fillText('F', 0, 25);
      ctx.lineWidth = 4.5;
      ctx.strokeStyle = '#111';

      // Arms
      const wave = Math.sin(t * 10) * 0.35;
      ctx.save();
      ctx.translate(-34, 16);
      ctx.rotate(0.4 + wave);
      ctx.fillStyle = '#4ea82f';
      roundRect(ctx, -24, -8, 24, 18, 6);
      ctx.fillStyle = '#76c84d';
      ctx.beginPath();
      ctx.arc(-26, 0, 11, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.restore();

      ctx.save();
      ctx.translate(34, 16);
      ctx.rotate(-0.4 - wave);
      ctx.fillStyle = '#4ea82f';
      roundRect(ctx, 0, -8, 24, 18, 6);
      ctx.fillStyle = '#76c84d';
      ctx.beginPath();
      ctx.arc(26, 0, 11, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.restore();

      // Choy-Sum Head
      ctx.save();
      ctx.translate(0, -34);

      const leafPositions = [
        { x: -34, y: -64, rot: -0.35, r: 36 },
        { x: 0, y: -78, rot: 0, r: 40 },
        { x: 34, y: -64, rot: 0.35, r: 36 }
      ];
      leafPositions.forEach((lf) => {
        ctx.save();
        ctx.translate(lf.x, lf.y);
        ctx.rotate(lf.rot);
        ctx.fillStyle = '#2d8a1e';
        ctx.beginPath();
        ctx.arc(0, 0, lf.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.strokeStyle = '#a7e971';
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(0, 32);
        ctx.lineTo(0, -18);
        ctx.moveTo(0, 8);
        ctx.lineTo(-14, -6);
        ctx.moveTo(0, 8);
        ctx.lineTo(14, -6);
        ctx.stroke();
        ctx.strokeStyle = '#111';
        ctx.lineWidth = 4.5;
        ctx.restore();
      });

      const grad = ctx.createLinearGradient(0, -45, 0, 38);
      grad.addColorStop(0, '#c8f299');
      grad.addColorStop(0.45, '#f6fff0');
      grad.addColorStop(1, '#ffffff');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(-36, -34);
      ctx.bezierCurveTo(-54, 12, -46, 40, 0, 40);
      ctx.bezierCurveTo(46, 40, 54, 12, 36, -34);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = 'rgba(255, 130, 130, 0.55)';
      ctx.beginPath();
      ctx.ellipse(-26, 16, 8, 5, 0, 0, Math.PI * 2);
      ctx.ellipse(26, 16, 8, 5, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#111';
      ctx.beginPath();
      ctx.ellipse(-16, 4, 7, 10, 0, 0, Math.PI * 2);
      ctx.ellipse(16, 4, 7, 10, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(-18, 0, 3, 0, Math.PI * 2);
      ctx.arc(14, 0, 3, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#801b1b';
      ctx.beginPath();
      ctx.arc(0, 18, 11, 0, Math.PI, false);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.restore();
      ctx.restore();
    }

    // ============================================================================
    // STAGE & ENVIRONMENT RENDERING
    // ============================================================================

    function drawEnvironment(ctx, t, scene) {
      const skyGrad = ctx.createLinearGradient(0, 0, 0, 520);
      if (scene === 'viking_scary') {
        skyGrad.addColorStop(0, '#2c1654');
        skyGrad.addColorStop(1, '#6f3895');
      } else {
        skyGrad.addColorStop(0, '#38b6ff');
        skyGrad.addColorStop(1, '#b8e7ff');
      }
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Sun
      ctx.save();
      ctx.translate(180, 110);
      const sunPulse = 1 + Math.sin(t * 4) * 0.06;
      ctx.scale(sunPulse, sunPulse);
      ctx.fillStyle = scene === 'viking_scary' ? '#ff9e00' : '#ffea00';
      ctx.beginPath();
      ctx.arc(0, 0, 52, 0, Math.PI * 2);
      ctx.fill();
      ctx.lineWidth = 4;
      ctx.strokeStyle = '#ffaa00';
      ctx.stroke();
      ctx.restore();

      // Clouds
      const cloudPositions = [
        { baseX: 250, y: 110, speed: 12, scale: 0.9 },
        { baseX: 700, y: 85, speed: 16, scale: 1.1 },
        { baseX: 1080, y: 130, speed: 10, scale: 0.85 }
      ];
      cloudPositions.forEach((c) => {
        const cx = ((c.baseX + t * c.speed) % 1400) - 80;
        ctx.save();
        ctx.translate(cx, c.y);
        ctx.scale(c.scale, c.scale);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.88)';
        ctx.beginPath();
        ctx.arc(0, 0, 32, 0, Math.PI * 2);
        ctx.arc(28, -8, 38, 0, Math.PI * 2);
        ctx.arc(62, 0, 30, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      // Background Hill (Cobra Man's Stomping Ground)
      ctx.fillStyle = scene === 'viking_scary' ? '#3c5a3e' : '#65c445';
      ctx.strokeStyle = '#1b4314';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(-20, 460);
      ctx.quadraticCurveTo(640, 330, 1300, 460);
      ctx.lineTo(1300, 720);
      ctx.lineTo(-20, 720);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Foreground Stage Floor
      ctx.fillStyle = scene === 'viking_scary' ? '#4f772d' : '#80ed51';
      ctx.beginPath();
      ctx.moveTo(-20, 500);
      ctx.quadraticCurveTo(640, 445, 1300, 500);
      ctx.lineTo(1300, 720);
      ctx.lineTo(-20, 720);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }

    function updateAndDrawEffects(ctx, dt, t, scene) {
      for (let i = stompPuffs.length - 1; i >= 0; i--) {
        const p = stompPuffs[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.r += 18 * dt;
        p.alpha -= 1.2 * dt;
        if (p.alpha <= 0) {
          stompPuffs.splice(i, 1);
          continue;
        }
        ctx.save();
        ctx.fillStyle = `rgba(180, 165, 195, ${p.alpha})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      if (scene === 'violin' && Math.random() < 0.16) {
        floatingNotes.push({
          x: 640 + (Math.random() - 0.5) * 140,
          y: 380,
          vx: (Math.random() - 0.5) * 60,
          vy: -70 - Math.random() * 40,
          alpha: 1,
          symbol: Math.random() > 0.5 ? '♪' : '♫'
        });
      }

      for (let i = floatingNotes.length - 1; i >= 0; i--) {
        const n = floatingNotes[i];
        n.x += n.vx * dt;
        n.y += n.vy * dt;
        n.alpha -= 0.65 * dt;
        if (n.alpha <= 0) {
          floatingNotes.splice(i, 1);
          continue;
        }
        ctx.save();
        ctx.font = 'bold 38px sans-serif';
        ctx.fillStyle = `rgba(255, 230, 0, ${n.alpha})`;
        ctx.strokeStyle = `rgba(0, 0, 0, ${n.alpha})`;
        ctx.lineWidth = 3;
        ctx.strokeText(n.symbol, n.x, n.y);
        ctx.fillText(n.symbol, n.x, n.y);
        ctx.restore();
      }
    }

    function drawGiantVBadge(ctx, t) {
      ctx.save();
      ctx.translate(640, 135 + Math.sin(t * 6) * 10);
      const scale = 1 + Math.abs(Math.sin(t * 8)) * 0.14;
      ctx.scale(scale, scale);

      ctx.fillStyle = '#ffea00';
      ctx.strokeStyle = '#d84315';
      ctx.lineWidth = 8;
      ctx.font = '900 105px "Segoe UI", Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.strokeText('V', 0, 0);
      ctx.fillText('V', 0, 0);
      ctx.restore();
    }

    // ============================================================================
    // MAIN ANIMATION LOOP
    // ============================================================================

    function renderLoop(now) {
      const dt = Math.min(0.1, (now - lastFrameTime) / 1000);
      lastFrameTime = now;

      let currentTime = 0;
      if (hasAudio) {
        currentTime = audioPlayer.currentTime;
      } else {
        if (isPlaying) {
          simTime += dt;
          if (simTime >= totalDuration) {
            simTime = totalDuration;
            isPlaying = false;
            playBtn.textContent = '▶ Play';
          }
        }
        currentTime = simTime;
      }

      // Sync UI scrubber & timer
      scrubber.value = currentTime;
      timeReadout.textContent = `${currentTime.toFixed(2).padStart(5, '0')}s / ${totalDuration.toFixed(2)}s`;

      // Get current SRT lyric & scene state
      const step = getCurrentStep(currentTime);
      if (lyricText.innerHTML !== step.html) {
        lyricText.innerHTML = step.html;
        lyricSub.textContent = step.sub;
      }

      // 1. Draw Sky, Hills & Stage
      drawEnvironment(ctx, currentTime, step.scene);

      // 2. Draw Cobra Man ALWAYS patrolling & stomping angrily on the background hill!
      const cobraX = 640 + Math.sin(currentTime * 0.95) * 340;
      const cobraY = 335 + Math.abs(Math.sin(currentTime * 0.95)) * 22;
      drawCobraMan(ctx, cobraX, cobraY, 0.72, currentTime);

      updateAndDrawEffects(ctx, dt, currentTime, step.scene);

      // 3. Draw Foreground Characters According to Active SRT Verse
      const phonicMode = step.scene === 'viking_scary' ? 'scared' : (step.scene === 'finale' || step.scene === 'outro' ? 'cheer' : 'dance');
      const vMonsterMode = step.scene === 'viking_scary' ? 'scared' : 'dance';

      if (step.scene === 'intro' || step.scene === 'v_intro') {
        drawGiantVBadge(ctx, currentTime);
        drawPhonicsMan(ctx, 430, 445, 1.05, currentTime, phonicMode);
        drawVMonster(ctx, 830, 450, 1.05, currentTime, vMonsterMode);
      } else if (step.scene === 'violin') {
        drawPhonicsMan(ctx, 240, 455, 0.92, currentTime, phonicMode);
        drawViolinMan(ctx, 640, 450, 1.15, currentTime);
        drawVMonster(ctx, 1020, 455, 0.92, currentTime, vMonsterMode);
      } else if (step.scene === 'viking' || step.scene === 'viking_scary') {
        drawPhonicsMan(ctx, 220, 455, 0.92, currentTime, phonicMode);
        drawViking(ctx, 640, 445, 1.2, currentTime);
        drawVMonster(ctx, 1040, 455, 0.92, currentTime, vMonsterMode);
      } else if (step.scene === 'vegetable') {
        drawPhonicsMan(ctx, 240, 455, 0.92, currentTime, phonicMode);
        drawChoySumMan(ctx, 640, 450, 1.15, currentTime);
        drawVMonster(ctx, 1020, 455, 0.92, currentTime, vMonsterMode);
      } else {
        // Finale & Outro (29.80s onwards): Everyone on stage dancing together!
        drawGiantVBadge(ctx, currentTime);
        drawPhonicsMan(ctx, 175, 460, 0.85, currentTime, 'cheer');
        drawViolinMan(ctx, 410, 465, 0.85, currentTime);
        drawVMonster(ctx, 640, 455, 0.95, currentTime, 'dance');
        drawViking(ctx, 870, 465, 0.85, currentTime);
        drawChoySumMan(ctx, 1105, 465, 0.85, currentTime);
      }

      requestAnimationFrame(renderLoop);
    }

    requestAnimationFrame(renderLoop);
  </script>
</body>
